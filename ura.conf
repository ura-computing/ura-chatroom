@name "ura-chatroom"
@version "0.0.1"
@main "src/server.ura"
@script "server" "ura src/server.ura -o build/server"
@script "client" "ura src/client.ura -o build/client"
@script "run-server" "ura src/server.ura -o build/server && ./build/server"
@script "run-client" "ura src/client.ura -o build/client && ./build/client"

@dependency "ura-core" "0.0.1" "https://github.com/ura-computing/ura-core"
@dependency "ura-posix" "0.0.1" "https://github.com/ura-computing/ura-posix"
@dependency "ura-math" "0.0.1" "https://github.com/ura-computing/ura-math"
