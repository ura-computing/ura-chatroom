@name "ura-chatroom"
@version "0.0.1"

@script "server":
    @cmd "ura compile src/server.ura -o build/server"
@script "client":
    @cmd "ura compile src/client.ura -o build/client"
@script "run-server":
    @cmd "ura compile src/server.ura -o build/server && ./build/server"
@script "run-client":
    @cmd "ura compile src/client.ura -o build/client && ./build/client"

@dep "core":
    @url "https://github.com/ura-computing/ura-core"
    @version "0.0.1"
@dep "posix":
    @url "https://github.com/ura-computing/ura-posix"
    @version "0.0.1"
@dep "math":
    @url "https://github.com/ura-computing/ura-math"
    @version "0.0.1"
